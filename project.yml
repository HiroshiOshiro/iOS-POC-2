name: iOS-POC-2
options:
  bundleIdPrefix: com.example
  developmentLanguage: ja
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Feature:
    path: Packages/Feature
  Core:
    path: Packages/Core
  # 共通 UI（import 名 Ui）。app は実際には import しないが、Xcode でトップレベルの
  # パッケージとして見えるよう packages: に載せ、app ターゲットからも直接依存する。
  Design:
    path: Packages/Design
  Factory:
    url: https://github.com/hmlongco/Factory.git
    from: 3.3.2
  # スクリーンショット（スナップショット）テスト。iOS-POC-2Tests から使う。
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 明示モジュール（Xcode 16）を無効化。SnapshotTesting が WebKit を引き込む際に
    # 明示モジュールで os_object / WebKit の PCM ビルドが失敗する不具合を回避する。
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
targets:
  iOS-POC-2:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - iOS-POC-2
    # ビルド時に SwiftLint を実行（未インストールなら警告のみ）。
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint 未インストール（brew install swiftlint）"
          fi
    dependencies:
      # 機能モジュール（api/impl）。合成ルートとして両方を参照する。
      - package: Feature
        product: ConfirmApi
      - package: Feature
        product: ConfirmImpl
      - package: Feature
        product: LoginImpl
      - package: Feature
        product: MusicImpl
      # 合成ルートとして ObjC 実装を Factory に登録するための依存。
      - package: Core
        product: Data
      # どこからでもログ出力できる共通モジュール。
      - package: Core
        product: Common
      # 共通 UI（import 名 Ui）。app は import しないが、トップレベル package として
      # Xcode に見せるための直接依存。
      - package: Design
        product: Ui
      - package: Factory
        product: FactoryKit
    scheme:
      testTargets:
        - iOS-POC-2Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iOS-POC-2
        INFOPLIST_FILE: iOS-POC-2/Info.plist
        # POC のため AppIcon は未設定（アセットカタログの AppIcon 要求を無効化）
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_ENABLE_MODULES: YES
        # Swift 相互運用の準備（POC で一部を Swift 化する際に使用）
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: iOS-POC-2/iOS-POC-2-Bridging-Header.h
        SWIFT_OBJC_INTERFACE_HEADER_NAME: iOS-POC-2-Swift.h

  # Keychain はホストアプリが無いと entitlement 不足（-34018）で使えないため、
  # アプリをテストホストにしたユニットテストターゲットで検証する。
  iOS-POC-2Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # 基準 PNG はビルド入力（リソース）にしない。SnapshotTesting が実行時に
      # ファイルパスで直接読み書きするため。含めると、記録の貼り替えで PNG を
      # 削除したとき「Build input file cannot be found」になる。
      - path: Tests
        excludes:
          - "Snapshot/__Snapshots__/**"
    dependencies:
      - target: iOS-POC-2
      - package: Core
        product: Datastore
      # スナップショットテスト用。公開 *ScreenFactory を撮るため impl と、
      # スタブ UseCase を DI 登録するため Domain/Model/Factory/SnapshotTesting に依存する。
      - package: SnapshotTesting
        product: SnapshotTesting
      - package: Feature
        product: LoginImpl
      - package: Feature
        product: MusicImpl
      - package: Core
        product: Domain
      - package: Core
        product: Model
      - package: Factory
        product: FactoryKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iOS-POC-2.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
